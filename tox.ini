[tox]
envlist =
    ruff
    py{311,312,313}-dj52-cms5

skip_missing_interpreters=True

[testenv]
deps =
    dj52-cms5: -r{toxinidir}/tests/requirements/dj52_cms5.txt
passenv =
    DATABASE_URL
commands =
    {envpython} --version
    {env:COMMAND:coverage} erase
    {env:COMMAND:coverage} run test_settings.py
    {env:COMMAND:coverage} report

[testenv:ruff]
deps = ruff
skip_install = true
commands =
    ruff check tests test_settings.py
    ruff check --select E9,F63,F7,F82 djangocms_translations
